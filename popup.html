<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; margin: 0; padding: 12px; font: 13px/1.4 system-ui, sans-serif; color: #1f1f1f; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .empty { color: #666; }
    .item { border: 1px solid #ddd; border-radius: 8px; padding: 8px; margin-bottom: 8px; }
    .title { font-weight: 600; word-break: break-word; }
    .meta { color: #777; font-size: 11px; margin: 2px 0 6px; }
    button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid #bbb; background: #fff; cursor: pointer; }
    button.primary { background: #f96854; border-color: #f96854; color: #fff; }
    button + button { margin-left: 6px; }
  </style>
</head>
<body>
  <h1>Patreon Video Saver</h1>
  <div id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
