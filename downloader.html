<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Patreon Video Saver</title>
  <style>
    body { max-width: 640px; margin: 40px auto; padding: 0 16px; font: 14px/1.5 system-ui, sans-serif; color: #1f1f1f; }
    h1 { font-size: 18px; word-break: break-word; }
    select, button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #bbb; background: #fff; }
    button.primary { background: #f96854; border-color: #f96854; color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    progress { width: 100%; height: 18px; margin-top: 16px; }
    #status { margin-top: 8px; color: #444; }
    #status.error { color: #b3261e; }
    pre { background: #f4f4f4; padding: 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
    .row > * + * { margin-left: 8px; }
  </style>
</head>
<body>
  <h1 id="title"></h1>
  <div class="row">
    <select id="quality" hidden></select>
    <button id="start" class="primary" disabled>Download</button>
    <button id="cancel" hidden>Cancel</button>
  </div>
  <progress id="bar" value="0" max="1" hidden></progress>
  <div id="status">Loading stream info…</div>
  <pre id="hint" hidden></pre>
  <p>Keep this tab open until the download finishes.</p>
  <script src="downloader.js"></script>
</body>
</html>
